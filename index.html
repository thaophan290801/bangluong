<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tính lương theo ca</title>
<style>
:root{--bg:#fbf6e9;--fg:#2c3a38;--card:#fffdf6;--ac:#1f6b63;--bd:#e6dcc0;--or:#f2b03d}
body{margin:0;font:16px/1.45 'Trebuchet MS','Segoe UI',sans-serif;color:var(--fg);background:var(--bg) repeating-linear-gradient(#0000 0 31px,#e3eaea 31px 32px);border-left:3px solid #f0b8ae}
main{max-width:560px;margin:auto;padding:12px 14px 40px}
.c{background:var(--card);border:3px solid var(--bd);border-radius:22px;padding:14px;margin:12px 0}
.tc{text-align:center}h2,h3{color:var(--ac);margin:.3em 0}
input,select,textarea{font:inherit;padding:10px 12px;border:2px solid var(--bd);border-radius:14px;background:#fff;color:var(--fg);max-width:100%;box-sizing:border-box}
select{width:100%;font-size:17px}
button{font:inherit;font-weight:700;padding:10px 16px;border:2px solid #c98a1c;border-bottom-width:5px;border-radius:999px;background:linear-gradient(#f8c466,var(--or));color:#4a2e00;cursor:pointer}
button:active{transform:translateY(2px);border-bottom-width:3px}
button.g{background:#efe7d2;border-color:var(--bd);color:#5d6b68}button.on{background:var(--ac);border-color:#14463f;color:#fff}
button.big{font-size:20px;padding:12px 60px}
.dt{font-size:22px;font-weight:700;color:var(--ac)}.num{font-size:40px;font-weight:800;color:var(--ac)}
.r{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.d{border-top:2px dashed var(--bd);padding:8px 0}
.n{margin-left:auto;text-align:right;font-weight:700;color:var(--ac)}.s{font-size:14px;color:#6b7a77}
table{width:100%;border-collapse:collapse}td{padding:6px 0;border-top:2px dashed var(--bd)}td+td{text-align:right}
textarea{width:100%;min-height:90px}label{display:block;margin:8px 0 2px;font-size:14px;color:#6b7a77}
.ov{position:fixed;inset:0;background:#2c3a3899;display:grid;place-items:center;z-index:9}
.pp{background:var(--card);border:4px solid var(--or);border-radius:26px;padding:20px 28px;text-align:center;max-width:320px;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.pp{animation:none}}
@media print{button,select,input,.np{display:none}}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ===== CẤU HÌNH: dán thông tin từ Supabase > Project Settings > API =====
const SUPABASE_URL='https://rpumybmzumilwrqxaccj.supabase.co';
const SUPABASE_KEY='sb_publishable_QT0Y4cvp5rHVBgRFTaRclw_8sbCXEwZ';
// Tham số tính lương (theo file Excel)
const CFG={luongCS:2340000,luongVung:4960000,gtBanThan:15500000,gtNPT:6200000,xh:.08,yt:.015,tn:.01,
  heSo:{1:1.5,2:2,3:2.7,4:3,5:2.1,6:3.9}};
const SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString('vi-VN'),
 iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
 mins=t=>{const[a,b]=t.split(':');return +a*60+ +b},DN=['CN','T2','T3','T4','T5','T6','T7'],
 ck=r=>{if(r.error)alert('Lỗi: '+r.error.message);return r},
 opt=(l,s)=>l.map(([v,t])=>`<option value="${v}" ${v==s?'selected':''}>${t}</option>`).join('');
let me,emps=[],cur,D={},HOL=new Set(),BR=[],ADJ={amount:0,note:''},RS,T='today',ym=iso(new Date()).slice(0,7);

function per(p,ym){const[y,m]=ym.split('-').map(Number),s=p.period_start_day,a=new Date(y,m-1,s),
 b=s==1?new Date(y,m,0):new Date(y,m,s-1),l=[];for(let d=a;d<=b;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))l.push(d);return l}

function calc(p,list){
 const std=p.std_mode=='weekdays'?list.filter(d=>d.getDay()%6).length:26,base=+p.base_salary,hr=Math.round(base/std/8);
 let days=0,baseP=0,otP=0,cum=0,rows=[];
 for(const d of list){
  const k=iso(d),w=D[k]||{},off=(p.weekly_off||[0]).includes(d.getDay()),hl=HOL.has(k),norm=!off&&!hl;
  let b=0,ot={},pay=0,tag=hl?'Lễ':off?'Nghỉ tuần':'';
  const work=['worked','changed'].includes(w.status)&&w.start_t&&w.end_t;
  if((w.status=='leave'||work)&&norm){b=base/std;days++}
  if(work){let s=mins(w.start_t),e=mins(w.end_t);if(e<=s)e+=1440;let n=0,first=null;
   for(let t=s;t<e;t++){n++;if(!norm||n>480){const ni=t%1440>=1320||t%1440<360;if(first===null)first=ni;
    const i=hl?(ni?6:4):off?(ni?3:2):ni?(first?2:5):1;ot[i]=(ot[i]||0)+1}}}
  const o=Object.entries(ot).reduce((a,[i,m])=>a+m/60*hr*CFG.heSo[i],0);
  pay=b+o;baseP+=b;otP+=o;cum+=pay;
  rows.push({k,d,tag,b,o,pay,cum,ot:Object.entries(ot).map(([i,m])=>`OT ${(m/60).toFixed(1)}h×${CFG.heSo[i]}`).join(', '),st:w.status||''});
 }
 const fuel=p.fuel_allowance*days/std,W=baseP+fuel,nopBH=std-days<14,
  xh=nopBH?Math.min(baseP,20*CFG.luongCS)*CFG.xh:0,yt=nopBH?Math.min(baseP,20*CFG.luongCS)*CFG.yt:0,tn=nopBH?Math.min(baseP,20*CFG.luongVung)*CFG.tn:0,
  X=Math.max(0,W-CFG.gtBanThan-CFG.gtNPT*p.dependents-xh-yt-tn);
 let tax=0,lo=0;for(const b of BR){const hi=b.upper??Infinity;if(X>lo)tax+=(Math.min(X,hi)-lo)*b.rate;lo=hi}
 const adj=+ADJ.amount||0;
 return{rows,std,hr,days,baseP,fuel,otP,W,xh,yt,tn,X,tax,adj,net:W+otP-xh-yt-tn-tax+adj};
}

async function boot(){
 if(SUPABASE_KEY.startsWith('DAN_KHOA')||/[^\x20-\x7E]/.test(SUPABASE_KEY)){$('#app').innerHTML='<div class=c><h3>Chưa cấu hình khóa Supabase</h3><p>Mở index.html, thay DAN_KHOA_ANON_VAO_DAY bằng khóa anon public (chỉ chữ và số, không dấu) rồi lưu lại.</p></div>';return}
 const{data:{session}}=await SB.auth.getSession();if(!session)return login();
 me=(await SB.from('profiles').select('*').eq('id',session.user.id).single()).data;
 emps=me.role=='manager'?(await SB.from('profiles').select('*').order('full_name')).data:[me];cur=emps[0];ym=cy();
 HOL=new Set((await SB.from('holidays').select('d')).data.map(x=>x.d));
 BR=(await SB.from('tax_brackets').select('*').order('rate')).data;load();
}
async function load(){
 const l=per(cur,ym),[d,a]=await Promise.all([
  SB.from('work_days').select('*').eq('user_id',cur.id).gte('work_date',iso(l[0])).lte('work_date',iso(l[l.length-1])),
  SB.from('adjustments').select('*').eq('user_id',cur.id).eq('ym',ym).maybeSingle()]);
 D={};(d.data||[]).forEach(r=>D[r.work_date]=r);ADJ=a.data||{amount:0,note:''};render();
}
function login(){$('#app').innerHTML=`<div class='c tc'>${MS}<h2>Bảng lương vui</h2><p class=s>Đăng nhập để bắt đầu nhé</p><div class=r><input id=em type=email placeholder=Email><input id=pw type=password placeholder="Mật khẩu"><button onclick=signin()>Đăng nhập</button></div></div>`}
async function signin(){const r=await SB.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});r.error?alert('Không đăng nhập được: '+r.error.message):boot()}
async function out(){await SB.auth.signOut();login()}

function render(){
 const M=me.role=='manager',R=RS=calc(cur,per(cur,ym));
 const tabs=[['today','Hôm nay'],['days','Ngày công'],['sum','Tổng kết'],['img','Lịch ca'],...(M?[['prof','Hồ sơ'],['cfg','Ngày lễ & thuế']]:[])];
 let h=`<div class="c np"><div class=r><b>${me.full_name}</b>${M?`<select onchange="cur=emps[this.value];ym=cy();load()">${emps.map((e,i)=>`<option value=${i} ${e.id==cur.id?'selected':''}>${e.full_name}</option>`).join('')}</select>`:''}
 <input type=month value="${ym}" onchange="ym=this.value;load()"><button class=g onclick=out()>Thoát</button></div>
 <div class=r style="margin-top:8px">${tabs.map(([k,t])=>`<button class="${T==k?'on':'g'}" onclick="T='${k}';render()">${t}</button>`).join('')}</div></div>`;
 if(T=='today')h+=todayHtml(R);
 if(T=='days'){
  h+=`<div class=c><div class=r><b>Lương tạm tính</b><span class=n>${fmt(R.rows.at(-1).cum)} đ</span></div><div class=s>Lương giờ ${fmt(R.hr)} đ · ${R.days}/${R.std} công</div>`+R.rows.map(r=>{
   const w=D[r.k]||{},on=['worked','changed'].includes(w.status);
   return `<div class=d><div class=r><b>${DN[r.d.getDay()]} ${r.d.getDate()}/${r.d.getMonth()+1}</b><span class=s>${r.tag}</span>
   <select onchange="sd('${r.k}','status',this.value)">${opt([['','—'],['worked','Đúng ca'],['changed','Đổi ca'],['leave','Nghỉ phép'],['off','Nghỉ'],['absent','Vắng']],w.status||'')}</select>
   ${on?`<select onchange="sd('${r.k}','shift',this.value)">${opt([['','Tự nhập'],...(SH(cur)).map(s=>[s.c,s.c])],w.shift||'')}</select>
   <input type=time value="${w.start_t||''}" onchange="sd('${r.k}','start_t',this.value)"><input type=time value="${w.end_t||''}" onchange="sd('${r.k}','end_t',this.value)">`:''}
   <span class=n>${r.pay?fmt(r.pay)+' đ':''}<div class=s>${r.ot}${r.pay?' · lũy kế '+fmt(r.cum):''}</div></span></div></div>`}).join('')+`</div>`;
 }
 if(T=='sum'){
  const L=[['Lương cơ bản theo công',R.baseP],['Phụ cấp xăng',R.fuel],['Lương OT (miễn thuế)',R.otP],['BHXH 8%',-R.xh],['BHYT 1,5%',-R.yt],['BHTN 1%',-R.tn],['Thu nhập tính thuế',R.X],['Thuế TNCN',-R.tax],['Điều chỉnh khác'+(ADJ.note?' ('+ADJ.note+')':''),R.adj]];
  h+=`<div class=c><table>${L.map(([a,b])=>`<tr><td>${a}<td>${fmt(b)}`).join('')}<tr><td><b>Thực lĩnh</b><td><b>${fmt(R.net)} đ</b></table></div>
  <div class="c np"><div class=r><input type=date id=xf><input type=date id=xt><button onclick=xl()>Xuất Excel</button><button class=g onclick=print()>Xuất PDF</button></div><div class=s>Để trống = cả kỳ lương. Chọn khoảng ngày để xuất báo cáo tuần.</div>
  ${M?`<label>Điều chỉnh khác (đoàn phí, thưởng lễ… số âm = trừ)</label><div class=r><input id=aa type=number value="${ADJ.amount||0}"><input id=an placeholder="Ghi chú" value="${ADJ.note||''}"><button onclick=sa()>Lưu</button></div>`:''}</div>`;
 }
 if(T=='img')h+=`<div class=c><input type=file accept="image/png" onchange="up(this.files[0])"><div id=il></div></div>`;
 if(T=='prof'&&M){const p=cur,f=(l,i,v,t='text')=>`<label>${l}</label><input id=${i} type=${t} value="${v??''}">`;
  h+=`<div class=c>${f('Họ tên','f1',p.full_name)}${f('Lương cơ bản','f2',p.base_salary,'number')}${f('Phụ cấp xăng','f3',p.fuel_allowance,'number')}${f('Số người phụ thuộc','f4',p.dependents,'number')}
  <label>Ngày công chuẩn</label><select id=f5>${opt([['26','26 ngày'],['weekdays','Số ngày T2–T6 trong kỳ']],p.std_mode)}</select>
  <label>Kỳ lương</label><select id=f6>${opt([[1,'Từ ngày 1 đến cuối tháng'],[24,'Từ 24 đến 23 tháng sau']],p.period_start_day)}</select>
  ${f('Ngày nghỉ tuần (0=CN, 6=T7, cách nhau dấu phẩy)','f7',(p.weekly_off||[0]).join(','))}
  <label>Ca (mỗi dòng: Tên 06:30-14:30)</label><textarea id=f8>${(SH(p)).map(s=>`${s.c} ${s.s}-${s.e}`).join('\n')}</textarea><br><button onclick=sp()>Lưu hồ sơ</button></div>`}
 if(T=='cfg'&&M)h+=`<div class=c><label>Ngày lễ (mỗi dòng YYYY-MM-DD)</label><textarea id=g1>${[...HOL].sort().join('\n')}</textarea>
  <label>Biểu thuế TNCN (mỗi dòng: "mức_trên_của_bậc %", bậc cuối ghi "max %", ví dụ 10000000 5)</label><textarea id=g2>${BR.map(b=>`${b.upper??'max'} ${b.rate*100}`).join('\n')}</textarea><br><button onclick=sc()>Lưu</button></div>`;
 $('#app').innerHTML=h;if(T=='img')imgs();
}
async function sd(k,f,v){
 const w={...(D[k]||{}),[f]:v||null};
 if(f=='shift'){const s=(SH(cur)).find(x=>x.c==v);if(s){w.start_t=s.s;w.end_t=s.e}}
 D[k]=w;ck(await SB.from('work_days').upsert({user_id:cur.id,work_date:k,status:w.status,shift:w.shift,start_t:w.start_t,end_t:w.end_t}));render();
}
async function sa(){ck(await SB.from('adjustments').upsert({user_id:cur.id,ym,amount:+$('#aa').value,note:$('#an').value}));load()}
async function sp(){const g=i=>$('#'+i).value,u={full_name:g('f1'),base_salary:+g('f2'),fuel_allowance:+g('f3'),dependents:+g('f4'),std_mode:g('f5'),period_start_day:+g('f6'),
 weekly_off:g('f7').split(',').map(Number),shifts:g('f8').split('\n').map(l=>l.match(/^(\S+)\s+(\d{1,2}:\d\d)\s*-\s*(\d{1,2}:\d\d)/)).filter(Boolean).map(m=>({c:m[1],s:m[2].padStart(5,'0'),e:m[3].padStart(5,'0')}))};
 if(!ck(await SB.from('profiles').update(u).eq('id',cur.id)).error){Object.assign(cur,u);load()}}
async function sc(){
 const hs=$('#g1').value.split('\n').map(s=>s.trim()).filter(Boolean),bs=$('#g2').value.split('\n').map(l=>l.trim().split(/\s+/)).filter(a=>a.length>1).map(a=>({upper:isNaN(a[0])?null:+a[0],rate:+a[1]/100}));
 ck(await SB.from('holidays').delete().neq('d','1900-01-01'));if(hs.length)ck(await SB.from('holidays').insert(hs.map(d=>({d}))));
 ck(await SB.from('tax_brackets').delete().gte('id',0));if(bs.length)ck(await SB.from('tax_brackets').insert(bs));
 HOL=new Set(hs);BR=bs;load();
}
async function up(f){if(!f)return;const p=`${cur.id}/${Date.now()}.png`;ck(await SB.storage.from('schedules').upload(p,f));ck(await SB.from('schedules').insert({user_id:cur.id,path:p}));render()}
async function imgs(){
 const l=(await SB.from('schedules').select('*').eq('user_id',cur.id).order('created_at',{ascending:false}).limit(8)).data||[];
 const u=l.length?(await SB.storage.from('schedules').createSignedUrls(l.map(x=>x.path),3600)).data:[];
 $('#il').innerHTML=l.map((x,i)=>`<p class=s>${new Date(x.created_at).toLocaleDateString('vi-VN')}</p><img src="${u[i]?.signedUrl}" style="max-width:100%">`).join('')||'<p class=s>Chưa có ảnh. Chọn ảnh PNG lịch ca để tải lên.</p>';
}
function xl(){
 const a=$('#xf').value,b=$('#xt').value,rows=RS.rows.filter(r=>(!a||r.k>=a)&&(!b||r.k<=b)).map(r=>({Ngày:r.k,'Trạng thái':r.st,'Lương ngày':Math.round(r.b),'Lương OT':Math.round(r.o),'Chi tiết OT':r.ot,'Tổng ngày':Math.round(r.pay)}));
 rows.push({Ngày:'Thực lĩnh kỳ',  'Tổng ngày':Math.round(RS.net)});
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Luong');XLSX.writeFile(wb,`luong-${cur.full_name}-${ym}.xlsx`);
}
const DS=[['A','06:30','14:30'],['B','14:30','22:30'],['C','22:30','06:30'],['D1','06:30','18:30'],['D2','18:30','06:30']].map(([c,s,e])=>({c,s,e}));
const SH=p=>p.shifts&&p.shifts.length?p.shifts:DS;
const MS='<svg viewBox="0 0 120 130" width="96" aria-hidden="true"><path d="M45 18 38 4M75 18 85 4" stroke="#2a7b72" stroke-width="5" stroke-linecap="round"/><rect x="44" y="14" width="32" height="10" rx="3" fill="#f2b03d"/><rect x="26" y="22" width="68" height="82" rx="14" fill="#fffdf6" stroke="#1f6b63" stroke-width="5"/><path d="M26 40v-4a14 14 0 0 1 14-14h40a14 14 0 0 1 14 14v4Z" fill="#2a7b72"/><circle cx="48" cy="66" r="4" fill="#1d2b2a"/><circle cx="72" cy="66" r="4" fill="#1d2b2a"/><circle cx="40" cy="76" r="6" fill="#f6c2c0"/><circle cx="80" cy="76" r="6" fill="#f6c2c0"/><path d="M52 77q8 8 16 0" stroke="#1d2b2a" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="42" y="90" width="36" height="6" rx="3" fill="#f2b03d"/><ellipse cx="60" cy="118" rx="28" ry="4" fill="#0001"/></svg>';
function cy(){const t=new Date();let y=t.getFullYear(),m=t.getMonth()+1;if(cur.period_start_day==24&&t.getDate()<24){m--;if(!m){m=12;y--}}return y+'-'+String(m).padStart(2,'0')}
function todayHtml(R){
 const t=new Date(),k=iso(t),w=D[k]||{},sh=SH(cur),v=w.status=='worked'&&w.shift?'s:'+w.shift:['worked','changed'].includes(w.status)?'custom':w.status||'',
 ds=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'][t.getDay()]+', '+t.getDate()+'/'+(t.getMonth()+1)+'/'+t.getFullYear();
 return `<div class="c tc">${MS}<h2>Chào ${cur.full_name.split('@')[0]}!</h2><div class=dt>${ds}</div><p class=s>Hôm nay bạn làm ca nào?</p>
 <select id=ts onchange="$('#cu').style.display=this.value=='custom'?'flex':'none'">${opt([['','Chọn ca…'],...sh.map(s=>['s:'+s.c,`Ca ${s.c} · ${s.s}–${s.e}`]),['off','Nghỉ'],['custom','Tự nhập giờ']],v)}</select>
 <div id=cu class=r style="display:${v=='custom'?'flex':'none'};justify-content:center;margin-top:8px"><input type=time id=t1 value="${w.start_t||''}"><input type=time id=t2 value="${w.end_t||''}"></div>
 <p><button class=big onclick=send()>Gửi</button></p><div class=s>Lũy kế kỳ lương: <b>${fmt(R.rows.at(-1).cum)} đ</b> · ${R.days}/${R.std} công</div></div>`}
async function send(){
 const v=$('#ts').value,k=iso(new Date()),w={user_id:cur.id,work_date:k,status:null,shift:null,start_t:null,end_t:null};
 if(!v)return alert('Chọn ca trước nhé');
 if(v.startsWith('s:')){const s=(SH(cur)).find(x=>x.c==v.slice(2));Object.assign(w,{status:'worked',shift:s.c,start_t:s.s,end_t:s.e})}
 else if(v=='custom'){if(!$('#t1').value||!$('#t2').value)return alert('Nhập giờ vào và giờ ra');Object.assign(w,{status:'changed',start_t:$('#t1').value,end_t:$('#t2').value})}
 else w.status=v;
 if(ck(await SB.from('work_days').upsert(w)).error)return;
 D[k]=w;RS=calc(cur,per(cur,ym));pop(RS.rows.find(x=>x.k==k));
}
function pop(r){
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class=pp>${MS}<div class=s>Lương hôm nay</div><div class=num id=cn>0 đ</div><div class=s>${r.ot||'Không có OT'}</div><p>Lũy kế kỳ này: <b>${fmt(r.cum)} đ</b></p><button onclick="this.closest('.ov').remove();render()">Xong</button></div>`;
 document.body.append(o);const t=Math.round(r.pay),st=performance.now();
 (function f(n){const p=Math.min(1,(n-st)/900);$('#cn').textContent=fmt(t*p)+' đ';if(p<1)requestAnimationFrame(f)})(st);
}
SB.auth.onAuthStateChange(()=>{});boot();
</script></body></html>
